name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "Periodic Puzzle" main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build installer
        run: |
          iscc installer.iss

      - name: Generate checksums
        shell: powershell
        run: |
          Get-FileHash "dist\Periodic Puzzle.exe" -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            Out-File "dist\Periodic Puzzle.exe.sha256"

          Get-ChildItem "Output\*.exe" | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256 |
              Select-Object -ExpandProperty Hash |
              Out-File "$($_.FullName).sha256"
          }

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Periodic Puzzle.exe
            dist/Periodic Puzzle.exe.sha256
            Output/*.exe
            Output/*.exe.sha256